<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Dashboard — Dev</title>
    <!-- Fonts provided by the AYON host in production; loaded here for dev parity -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
       * Approximate AYON dark theme CSS variables for local development.
       * In production these are provided by the AYON host application.
       */
      :root {
        --md-sys-color-surface: #1a1a1f;
        --md-sys-color-on-surface: #e4e4ef;
        --md-sys-color-on-surface-variant: #9494a8;
        --md-sys-color-surface-container-low: #22222a;
        --md-sys-color-surface-container: #2a2a35;
        --md-sys-color-outline-variant: #3a3a4a;
        --md-sys-color-primary: #9b8ef5;

        --border-radius: 6px;
        --padding-s: 6px;
        --padding-m: 12px;
        --padding-l: 24px;

        --font-size-xs: 10px;
        --font-size-s: 12px;
        --font-size-m: 14px;
        --font-size-l: 18px;
        --font-size-xl: 24px;
        --font-size-2xl: clamp(28px, 3vw + 10px, 48px);

        --font-family: "Nunito Sans", system-ui, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--md-sys-color-surface);
        color: var(--md-sys-color-on-surface);
        font-family: var(--font-family);
        font-size: var(--font-size-m);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
